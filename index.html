<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>
    
<top_header>
    
</top_header>

<header>
    <div class="top_header">
        
    </div>

    <div class="header_content">
        <div class="logo">
            <a href="https://rezeknestehnikums.lv/" target="_blank">
                <img src="img/icons/logo-header.svg" alt="">
            </a>
        </div>
        <nav>
            <span>
                <a href="https://rezeknestehnikums.lv/par-tehnikumu/vesture/" target="_blank">
                    Par tehnikumu
                </a>
            </span>
            
            <span>
                <a href="https://rezeknestehnikums.lv/aktualitates/" target="_blank">
                    Aktualitātes
                </a>
            </span>
            
            <span>
                <a href="https://rezeknestehnikums.lv/audzekniem/macibas/stundu-saraksts/" target="_blank">
                    Audzēkņiem
                </a>
            </span>
            
            <span>
                <a href="https://rezeknestehnikums.lv/metodiskais-centrs/partikas-produktu-razosana/" target="_blank">
                    Metodiskais centrs
                </a>
            </span>

            <span>
                <a href="https://rezeknestehnikums.lv/pieauguso-izglitiba/" target="_blank">
                    Pieaugušo izglītība
                </a>
            </span>

            <span>

                </a>
            </span>
        </nav>

</header>

<main>
    <div class="button_section">
        <button id="button_first_floor">1. Stāvs</button>
        <button id="button_second_floor">2. Stāvs</button>
        <button id="button_third_floor">3. Stāvs</button>
        <button id="button_fourth_floor">4. Stāvs</button>
    </div>
    <div class="main_content">
        <h2 id="floor_number">
            N. Stāvs
        </h2>
        <div class="main_content_img_container">
            <img src="img/maps/thirdFloor.svg" alt="karte" id="floor_map_image">
        </div>

    </div>
    <div class="main_information">
        <img src="" alt="info" id="cabinet_image" class="cabinet_image">
        <h3 id="cabinet_number">
            Kabineta nr.: 111
        </h3>
        <p id="cabinet_qualification">
            Kvalifikācija
        </p>
    </div>


</main>


<footer>
<div class="footer_info">
    <div class="footer_logo">
        <img src="img/icons/logo-footer.svg" alt="">
    </div>
    <div class="footer_info_text">
        <p>
            <img src="img/icons/phone.svg" alt="" class="footer_img">
            +371 646 33664
        </p>
        <p>
            <img src="img/icons/email.svg" alt="" class="footer_img">
            pasts@rezeknestehnikums.lv
        </p>
    </div>
</div>

<div class="footer_kontakti">
    <span>
        <a href="https://rezeknestehnikums.lv/par-tehnikumu/kontakti/" target="_blank">

        </a>
    </span>

        <a href="https://rezeknestehnikums.lv/lapas-karte/" target="_blank">

        </a>
    </span>
    <span>
        <a href="https://github.com/GeoJan21" target="_blank" style="text-decoration: none; ">©</a> Rēzeknes tehnikums 2026
    </span>
</div>

<script src="scripts/app.js" defer></script>
